[paths]
# Chemin relatif au dossier de ce fichier, ou chemin absolu.
# Sous Windows, preferer 'C:\Users\nom\ajh-data' ou "C:/Users/nom/ajh-data".
data_dir = ".ajh"

[greenhouse]
timeout_seconds = 15
request_interval_seconds = 1

# Board reel : https://job-boards.greenhouse.io/cloudflare
# Page employeur : https://www.cloudflare.com/careers/jobs/
# Verifier le token depuis le lien Greenhouse officiel, jamais le deviner.
[[greenhouse.boards]]
company = "Cloudflare"
board_token = "cloudflare"

# Autres ATS M2.1 : ajouter uniquement des tokens issus d'un site carrière officiel.
# Même structure pour [lever], [lever_eu], [ashby], [smartrecruiters].
# [[lever.boards]]
# company = "Nom de l'entreprise"
# board_token = "token-verifie"

# La Bonne Alternance (usage non lucratif, clé via AJH_LBA_API_KEY).
# [lba]
# romes = ["M1805"]
# departements = ["13"]
# target_diploma_level = "7" # facultatif, à omettre pour une recherche plus large
