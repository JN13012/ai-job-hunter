[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-job-hunter"
version = "0.1.0"
description = "Recherche et suivi de candidatures : script first, AI only when necessary."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]

[project.scripts]
ajh = "ai_job_hunter.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_job_hunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
